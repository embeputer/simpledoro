<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>simpledoro</title>
  <meta name="description" content="A minimal pomodoro timer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M19 4C9 5 4 10 4 17c0 1.7 1.3 3 3 3 7 0 12-5 12-16z' fill='%237ec850'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="focus">
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hill back"></div>
    <div class="hill front"></div>
    <div class="tree t1"><i class="trunk"></i><i class="canopy"></i></div>
    <div class="tree t2"><i class="trunk"></i><i class="canopy"></i></div>
  </div>

  <main class="app card">
    <header class="brand">
      <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 4C9 5 4 10 4 17c0 1.7 1.3 3 3 3 7 0 12-5 12-16z" />
        <path class="vein" d="M7.5 16.5c3-4 7-7 9.5-8.5" fill="none" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span>simpledoro</span>
    </header>

    <div class="modes" role="tablist" aria-label="Timer mode">
      <button class="mode active" data-mode="focus" role="tab" aria-selected="true">focus</button>
      <button class="mode" data-mode="short" role="tab" aria-selected="false">short break</button>
      <button class="mode" data-mode="long" role="tab" aria-selected="false">long break</button>
    </div>

    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="92" />
        <circle class="ring-fg" id="ring" cx="100" cy="100" r="92" />
      </svg>
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
    </div>

    <div class="controls">
      <button id="toggle" class="primary">start</button>
      <button id="reset">reset</button>
      <button id="skip">skip</button>
    </div>

    <div class="dots" id="dots" aria-label="Completed focus sessions"></div>

    <p class="hint">space — start/pause · r — reset · s — skip</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
